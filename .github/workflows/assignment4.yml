name: Assignment 4 market dashboard

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend requirements
        run: python -m pip install -r requirements-assignment4.txt
        working-directory: backend
      - name: Run Assignment 4 backend checks
        run: python -m pytest -p no:cacheprovider tests/test_assignment4_*.py tests/test_assignment3_structure.py -q
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: node --test tests/*.test.js
        working-directory: frontend
      - name: Run non-fixing linters
        run: |
          node node_modules/oxlint/bin/oxlint .
          node node_modules/eslint/bin/eslint.js .
        working-directory: frontend
      - name: Build all applications
        run: npm run build
        working-directory: frontend
